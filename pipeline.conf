# Shared pipeline configuration for admixture.sh and structure.sh

# Input metadata
SAMPLE_INFO="1000Genomes/igsr_samples.tsv"

# Model parameters
KLIST="2 3 4 5 6 7 8 9 10"
THREADS="4"
RANDOM_SEED="43"
REPLICATES="1"

# Preprocessing defaults (used in commented preprocessing blocks)
CHR_START="1"
CHR_END="22"
RUN_CHR_PROCESS="1" # Whether to run chromosome preprocessing (1=yes, 0=no). If 0, assumes preprocessed files already exist.
PREPROCESS_THREADS="4"
MAF="0.01"
LD_WINDOW="50"
LD_STEP="10"
LD_R2="0.1"

# Tool paths
FASTSTRUCTURE_BIN="$HOME/.local/bin/fastStructure"
ADMIXTURE_BIN="$PWD/tools/admixture_linux-1.3.1/admixture"
# Optional: override bcftools path explicitly if auto-detection fails.
# By default, preprocess.sh also tries <conda-root>/envs/bcftools_tools/bin/bcftools.
BCFTOOLS_BIN=""
# Optional: override samtools path explicitly if auto-detection fails.
# By default, preprocess.sh also tries <conda-root>/envs/bcftools_tools/bin/samtools.
SAMTOOLS_BIN=""
# Reference FASTA used by bcftools norm (-f). If missing, preprocess.sh downloads
# the official FASTA.gz, decompresses it to .fasta, and rebuilds the .fai index.
REF_FA="1000Genomes/reference/human_g1k_v37.fasta"

# Shared data preprocess outputs
DATA_PREPROCESS_DIR="dump/common"
DATA_PREPROCESS_PREFIX="common"

# Prefix defaults
ADMIXTURE_PREFIX="admixture"
STRUCTURE_PREFIX="structure"

# Benchmarking
# 1=enable runtime/memory logging, 0=disable
BENCHMARK_ENABLED="1"

# Optional explicit individual population file for structure_threader.
# Leave empty to auto-use dump/structure/<STRUCTURE_PREFIX>_ind_file.tsv
# Uses --ind (per-individual labels)
IND_FILE=""
